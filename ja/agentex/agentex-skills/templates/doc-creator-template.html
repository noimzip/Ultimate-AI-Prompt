<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドキュメント作成ダッシュボード</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap');

  :root {
    --bg-primary: #0a0d14;
    --bg-secondary: #111827;
    --bg-tertiary: #1a2236;
    --accent: #8b5cf6;
    --accent-hover: #7c3aed;
    --accent-light: rgba(139, 92, 246, 0.12);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #1e293b;
    --border-focus: #8b5cf6;
    --card-bg: rgba(17, 24, 39, 0.75);
    --danger: #ef4444;
    --success: #10b981;
    --preview-bg: #0f172a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-primary);
    color: var(--text-main);
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .container {
    width: 100%;
    max-width: 1100px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.6);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }

  .header-icon {
    width: 40px;
    height: 40px;
    background: var(--accent-light);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3em;
  }

  h2 {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 1.5em;
  }

  .subtitle {
    font-size: 0.88em;
    color: var(--text-muted);
    margin-bottom: 22px;
    padding-left: 52px;
  }

  /* Title Input */
  .title-section {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .title-input {
    width: 100%;
    background: rgba(10, 13, 20, 0.6);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 14px 18px;
    border-radius: 10px;
    font-family: 'Outfit', sans-serif;
    font-size: 1.2em;
    font-weight: 600;
    outline: none;
    transition: border-color 0.2s;
  }

  .title-input:focus { border-color: var(--border-focus); }

  .title-label {
    font-size: 0.78em;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    display: block;
  }

  /* Layout */
  .main-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  /* Sections Editor Panel */
  .editor-panel {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    max-height: 580px;
    overflow-y: auto;
  }

  .panel-title {
    font-size: 0.82em;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .section-card {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    position: relative;
    transition: border-color 0.2s;
  }

  .section-card:hover {
    border-color: rgba(139, 92, 246, 0.3);
  }

  .section-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  .section-number {
    position: absolute;
    top: -8px;
    left: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 0.7em;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .section-controls {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-bottom: 10px;
  }

  .btn-icon {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85em;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .btn-icon:hover {
    color: var(--text-main);
    border-color: var(--text-muted);
  }

  .btn-icon.danger:hover {
    color: var(--danger);
    border-color: var(--danger);
  }

  .section-field {
    margin-bottom: 10px;
  }

  .section-field label {
    font-size: 0.72em;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
    display: block;
  }

  .section-field input,
  .section-field textarea {
    width: 100%;
    background: rgba(10, 13, 20, 0.5);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.88em;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
  }

  .section-field input:focus,
  .section-field textarea:focus {
    border-color: var(--border-focus);
  }

  .btn-add-section {
    width: 100%;
    background: transparent;
    border: 1px dashed rgba(139,92,246,0.4);
    color: var(--accent);
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.85em;
    font-weight: 600;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .btn-add-section:hover {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  /* Preview Panel */
  .preview-panel {
    background: var(--preview-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    max-height: 580px;
    overflow-y: auto;
    position: relative;
  }

  .preview-panel::before {
    content: 'プレビュー';
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 0.7em;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.6;
  }

  .preview-doc-title {
    font-family: 'Outfit', sans-serif;
    font-size: 1.6em;
    font-weight: 700;
    color: var(--text-main);
    border-bottom: 3px solid var(--accent);
    padding-bottom: 12px;
    margin-bottom: 24px;
  }

  .preview-section {
    margin-bottom: 22px;
  }

  .preview-heading {
    font-family: 'Outfit', sans-serif;
    font-size: 1.15em;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
    padding-left: 12px;
    border-left: 3px solid var(--accent);
  }

  .preview-body {
    font-size: 0.9em;
    line-height: 1.7;
    color: #cbd5e1;
    margin-bottom: 8px;
    padding-left: 16px;
  }

  .preview-bullets {
    list-style: none;
    padding-left: 16px;
    margin: 0;
  }

  .preview-bullets li {
    font-size: 0.88em;
    color: #94a3b8;
    line-height: 1.6;
    padding-left: 16px;
    position: relative;
  }

  .preview-bullets li::before {
    content: '•';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: 700;
  }

  /* Submit */
  .submit-area {
    display: flex;
    gap: 12px;
  }

  .form-container { flex: 1; }

  .btn-submit {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.95em;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 16px rgba(139,92,246,0.25);
  }

  .btn-submit:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(139,92,246,0.35);
  }

  /* Success View */
  .success-view {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }

  .success-icon { font-size: 3em; margin-bottom: 16px; }

  .success-view h3 {
    font-family: 'Outfit', sans-serif;
    font-size: 1.4em;
    margin-bottom: 12px;
  }

  .success-view p {
    color: var(--text-muted);
    font-size: 0.9em;
    margin-bottom: 20px;
  }

  .auth-warning {
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.3);
    border-radius: 10px;
    padding: 16px;
    text-align: left;
    font-size: 0.88em;
    color: #f59e0b;
    margin-bottom: 20px;
  }

  .btn-retry, .btn-open {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    font-family: inherit;
    font-size: 0.9em;
    transition: all 0.2s;
    text-decoration: none;
    margin: 6px;
  }

  .btn-retry { background: var(--accent); color: #fff; }
  .btn-open { background: var(--success); color: #fff; }

  @media (max-width: 800px) {
    .main-layout { grid-template-columns: 1fr; }
    .container { padding: 16px; }
  }
</style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="header-icon">📝</div>
      <h2>ドキュメント作成ダッシュボード</h2>
    </div>
    <div class="subtitle">セクションを追加・編集し、ドキュメント構造をプレビューで確認してください。</div>

    <!-- Editor View -->
    <div id="editor-view">
      <!-- Title -->
      <div class="title-section">
        <label class="title-label">ドキュメントタイトル</label>
        <input type="text" class="title-input" id="docTitleInput" placeholder="ドキュメントのタイトルを入力" oninput="updateTitle()">
      </div>

      <!-- Main Layout: Editor + Preview -->
      <div class="main-layout">
        <!-- Left: Section Editor -->
        <div class="editor-panel">
          <div class="panel-title">
            <span>セクション一覧</span>
            <span style="font-weight:400; color:var(--text-muted);" id="sectionCount">0件</span>
          </div>
          <div id="sectionsContainer"></div>
          <button class="btn-add-section" onclick="addSection()">+ セクションを追加</button>
        </div>

        <!-- Right: Live Preview -->
        <div class="preview-panel" id="previewPanel">
          <div class="preview-doc-title" id="previewTitle">無題のドキュメント</div>
          <div id="previewContent"></div>
        </div>
      </div>

      <!-- Submit -->
      <div class="submit-area">
        <form class="form-container" action="https://script.google.com/macros/s/AKfycbz3vrvsQAFoIqHXN1W4D41WqqbXs3Z7-IVhGuMvoSEueWNfyEZsKbc8z8WaPRiRCfhuwg/exec" method="POST" target="_blank" onsubmit="handleFormSubmit()">
          <input type="hidden" name="payload" id="payloadInput">
          <button type="submit" class="btn-submit">ドキュメントを作成する</button>
        </form>
      </div>
    </div>

    <!-- Success View -->
    <div class="success-view" id="success-view">
      <div class="success-icon">✅</div>
      <h3>処理を開始しました</h3>
      <div class="auth-warning">
        <strong>⚠️ 初回アクセスの場合</strong><br>
        別タブでGoogleの承認画面が表示されたら許可してください。許可直後はデータが送られないため、タブを閉じて下のボタンで再実行してください。
      </div>
      <button class="btn-retry" onclick="resetView()">もう一度実行する</button>
      <a href="https://docs.google.com" target="_blank" class="btn-open">Google ドキュメントを開く</a>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // Geminiが抽出・生成するドキュメントデータ
    // ----------------------------------------------------
    let extractedData = {
      action: "create_document",
      title: "新規ドキュメント",
      sections: [
        {
          id: "sec-1",
          heading: "はじめに",
          body: "このドキュメントの概要を記載します。",
          bullets: ["ポイント1", "ポイント2"]
        }
      ]
    };

    let idCounter = 1;

    // --- Title ---
    function updateTitle() {
      extractedData.title = document.getElementById('docTitleInput').value || "無題のドキュメント";
      renderPreview();
    }

    // --- Sections ---
    function renderSections() {
      const container = document.getElementById('sectionsContainer');
      container.innerHTML = '';

      extractedData.sections.forEach((sec, i) => {
        const bulletsText = (sec.bullets || []).join('\n');
        container.innerHTML += `
          <div class="section-card" id="sec-card-${i}">
            <div class="section-number">${i + 1}</div>
            <div class="section-controls">
              <button class="btn-icon" onclick="moveSection(${i}, -1)" title="上に移動" ${i === 0 ? 'disabled style="opacity:0.3"' : ''}>↑</button>
              <button class="btn-icon" onclick="moveSection(${i}, 1)" title="下に移動" ${i === extractedData.sections.length - 1 ? 'disabled style="opacity:0.3"' : ''}>↓</button>
              <button class="btn-icon danger" onclick="deleteSection(${i})" title="削除">×</button>
            </div>
            <div class="section-field">
              <label>見出し</label>
              <input type="text" value="${sec.heading}" oninput="updateSection(${i}, 'heading', this.value)">
            </div>
            <div class="section-field">
              <label>本文</label>
              <textarea rows="3" oninput="updateSection(${i}, 'body', this.value)">${sec.body || ''}</textarea>
            </div>
            <div class="section-field">
              <label>箇条書き（改行で区切り）</label>
              <textarea rows="2" oninput="updateBullets(${i}, this.value)">${bulletsText}</textarea>
            </div>
          </div>
        `;
      });

      document.getElementById('sectionCount').textContent = `${extractedData.sections.length}件`;
      renderPreview();
    }

    function updateSection(index, field, value) {
      extractedData.sections[index][field] = value;
      renderPreview();
    }

    function updateBullets(index, text) {
      extractedData.sections[index].bullets = text.split('\n').filter(b => b.trim() !== '');
      renderPreview();
    }

    function addSection() {
      idCounter++;
      extractedData.sections.push({
        id: "sec-" + idCounter,
        heading: "新しいセクション",
        body: "",
        bullets: []
      });
      renderSections();
      // Scroll to bottom
      const panel = document.querySelector('.editor-panel');
      panel.scrollTop = panel.scrollHeight;
    }

    function deleteSection(index) {
      if (extractedData.sections.length <= 1) {
        alert("最低1つのセクションが必要です。");
        return;
      }
      extractedData.sections.splice(index, 1);
      renderSections();
    }

    function moveSection(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= extractedData.sections.length) return;
      const temp = extractedData.sections[index];
      extractedData.sections[index] = extractedData.sections[newIndex];
      extractedData.sections[newIndex] = temp;
      renderSections();
    }

    // --- Preview ---
    function renderPreview() {
      document.getElementById('previewTitle').textContent = extractedData.title || "無題のドキュメント";

      const content = document.getElementById('previewContent');
      content.innerHTML = '';

      extractedData.sections.forEach(sec => {
        let sectionHtml = '<div class="preview-section">';

        if (sec.heading) {
          sectionHtml += `<div class="preview-heading">${sec.heading}</div>`;
        }

        if (sec.body) {
          sectionHtml += `<div class="preview-body">${sec.body}</div>`;
        }

        if (sec.bullets && sec.bullets.length > 0) {
          sectionHtml += '<ul class="preview-bullets">';
          sec.bullets.forEach(b => {
            if (b.trim()) sectionHtml += `<li>${b}</li>`;
          });
          sectionHtml += '</ul>';
        }

        sectionHtml += '</div>';
        content.innerHTML += sectionHtml;
      });
    }

    // --- Submit ---
    function handleFormSubmit() {
      document.getElementById('payloadInput').value = JSON.stringify(extractedData);
      setTimeout(() => {
        document.getElementById('editor-view').style.display = 'none';
        document.getElementById('success-view').style.display = 'block';
      }, 500);
    }

    function resetView() {
      document.getElementById('editor-view').style.display = 'block';
      document.getElementById('success-view').style.display = 'none';
    }

    // --- Init ---
    function initUI() {
      document.getElementById('docTitleInput').value = extractedData.title;
      idCounter = extractedData.sections.length;
      renderSections();
    }

    window.onload = function() {
      if (typeof window.INITIAL_DATA !== 'undefined') {
        extractedData = window.INITIAL_DATA;
      }
      initUI();
    };
  </script>
</body>
</html>
