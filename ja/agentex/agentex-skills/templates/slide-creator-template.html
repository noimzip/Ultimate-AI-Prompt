<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スライド作成ダッシュボード</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
  
  :root {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border: #334155;
    --card-bg: rgba(30, 41, 59, 0.7);
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-main);
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 900px;
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  h2 {
    color: var(--text-main);
    font-weight: 700;
    margin-top: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  h2 span {
    color: var(--accent);
  }

  .subtitle {
    font-size: 0.9em;
    color: var(--text-muted);
    margin-bottom: 25px;
  }

  .layout {
    display: grid;
    grid-template-columns: 250px 1fr;
    gap: 20px;
    margin-bottom: 25px;
  }

  /* Sidebar for Slides List */
  .sidebar {
    border-right: 1px solid var(--border);
    padding-right: 15px;
    max-height: 450px;
    overflow-y: auto;
  }

  .slide-tab {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
    margin-bottom: 8px;
    font-size: 0.85em;
    transition: all 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .slide-tab:hover {
    background: rgba(59, 130, 246, 0.1);
    color: var(--text-main);
  }

  .slide-tab.active {
    background: var(--accent);
    color: var(--text-main);
    font-weight: 600;
  }

  .btn-add-slide {
    width: 100%;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-muted);
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85em;
    transition: all 0.2s ease;
    margin-top: 10px;
  }

  .btn-add-slide:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Editor panel */
  .editor {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .input-group label {
    font-size: 0.8em;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .input-group input, .input-group textarea {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 12px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.9em;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .input-group input:focus, .input-group textarea:focus {
    border-color: var(--accent);
  }

  .btn-delete-slide {
    align-self: flex-end;
    background: #ef4444;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8em;
    font-weight: 600;
    transition: background 0.2s ease;
  }

  .btn-delete-slide:hover {
    background: #dc2626;
  }

  /* Preview Container representing actual slide presentation */
  .slide-preview-box {
    aspect-ratio: 16/9;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 30px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    margin-bottom: 20px;
  }

  .slide-preview-box::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .preview-title {
    font-size: 2.2em;
    font-weight: 700;
    margin: 0 0 15px 0;
    color: var(--text-main);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 10px;
    z-index: 1;
  }

  .preview-bullets {
    font-size: 1.1em;
    line-height: 1.6;
    margin: 0;
    padding-left: 20px;
    color: #cbd5e1;
    z-index: 1;
  }

  .preview-bullets li {
    margin-bottom: 10px;
  }

  .slide-number {
    position: absolute;
    bottom: 15px;
    right: 20px;
    font-size: 0.8em;
    color: var(--text-muted);
  }

  /* Action buttons */
  .actions {
    display: flex;
    gap: 15px;
    margin-top: 20px;
  }

  .btn-action {
    flex: 1;
    padding: 14px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1em;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
  }

  .btn-submit {
    background: var(--accent);
    color: white;
    border: none;
  }

  .btn-submit:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  .form-container {
    width: 100%;
  }

</style>
</head>
<body>

  <div class="container">
    <h2><span>■</span> スライド作成ダッシュボード</h2>
    <div class="subtitle">AIが下書きを構成しました。必要に応じてスライドの追加・変更・削除を行い、承認ボタンを押してください。</div>

    <div class="slide-preview-box" id="previewBox">
      <div class="preview-title" id="previewTitle">スライドタイトル</div>
      <ul class="preview-bullets" id="previewBullets">
        <li>箇条書きテキスト</li>
      </ul>
      <div class="slide-number" id="slideNumber">1 / 1</div>
    </div>

    <div class="layout">
      <div class="sidebar">
        <label style="font-size: 0.8em; font-weight:600; color:var(--accent); display:block; margin-bottom:10px;">スライド一覧</label>
        <div id="slideTabsContainer"></div>
        <button class="btn-add-slide" onclick="addSlide()">+ スライドを追加</button>
      </div>

      <div class="editor">
        <div class="input-group">
          <label>スライドタイトル</label>
          <input type="text" id="slideTitleInput" oninput="updateCurrentSlide()">
        </div>
        <div class="input-group">
          <label>箇条書き本文 (改行で複数行)</label>
          <textarea id="slideBulletsInput" rows="6" oninput="updateCurrentSlide()" placeholder="予定などを改行区切りで入力してください"></textarea>
        </div>
        <button class="btn-delete-slide" onclick="deleteCurrentSlide()">このスライドを削除</button>
      </div>
    </div>

    <div class="actions">
      <form class="form-container" action="https://script.google.com/macros/s/AKfycbz3vrvsQAFoIqHXN1W4D41WqqbXs3Z7-IVhGuMvoSEueWNfyEZsKbc8z8WaPRiRCfhuwg/exec" method="POST" target="_blank" onsubmit="handleFormSubmit()">
        <input type="hidden" name="payload" id="payloadInput">
        <button type="submit" class="btn-action btn-submit">スライドを承認してエクスポートする</button>
      </form>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // Geminiが抽出・生成するスライドデータ
    // ----------------------------------------------------
    let extractedData = {
      presentationTitle: "新規プレゼンテーション",
      slides: [
        { title: "タイトルスライド", bullets: ["発表の要約", "作成者: AIエージェント"] }
      ]
    };

    let currentSlideIndex = 0;

    // UI初期化
    function initUI() {
      renderTabs();
      loadSlide(0);
    }

    // スライド一覧（タブ）の描画
    function renderTabs() {
      const container = document.getElementById('slideTabsContainer');
      container.innerHTML = '';
      extractedData.slides.forEach((slide, index) => {
        const isActive = index === currentSlideIndex ? 'active' : '';
        const shortTitle = slide.title || `スライド ${index + 1}`;
        container.innerHTML += `
          <button class="slide-tab ${isActive}" onclick="loadSlide(${index})">
            <span>${index + 1}. ${shortTitle.substring(0, 15)}${shortTitle.length > 15 ? '...' : ''}</span>
          </button>
        `;
      });
    }

    // スライドデータの読み込み
    function loadSlide(index) {
      if (index < 0 || index >= extractedData.slides.length) return;
      currentSlideIndex = index;
      
      const slide = extractedData.slides[index];
      document.getElementById('slideTitleInput').value = slide.title;
      document.getElementById('slideBulletsInput').value = slide.bullets.join('\n');
      
      renderTabs();
      updatePreview();
    }

    // プレビューの更新
    function updatePreview() {
      const slide = extractedData.slides[currentSlideIndex];
      if (!slide) return;
      
      document.getElementById('previewTitle').innerText = slide.title || "(無題のスライド)";
      
      const bulletsContainer = document.getElementById('previewBullets');
      bulletsContainer.innerHTML = '';
      slide.bullets.forEach(bullet => {
        if (bullet.trim()) {
          bulletsContainer.innerHTML += `<li>${bullet}</li>`;
        }
      });

      document.getElementById('slideNumber').innerText = `${currentSlideIndex + 1} / ${extractedData.slides.length}`;
    }

    // 入力時のデータ反映
    function updateCurrentSlide() {
      const title = document.getElementById('slideTitleInput').value;
      const bulletsText = document.getElementById('slideBulletsInput').value;
      const bullets = bulletsText.split('\n');
      
      extractedData.slides[currentSlideIndex] = { title, bullets };
      
      // タブのテキストをリアルタイム反映するために再描画（フォーカスは外さない）
      const tabButton = document.querySelectorAll('.slide-tab')[currentSlideIndex];
      if (tabButton) {
        const shortTitle = title || `スライド ${currentSlideIndex + 1}`;
        tabButton.querySelector('span').innerText = `${currentSlideIndex + 1}. ${shortTitle.substring(0, 15)}${shortTitle.length > 15 ? '...' : ''}`;
      }
      
      updatePreview();
    }

    // スライドの追加
    function addSlide() {
      extractedData.slides.push({ title: "新しいスライド", bullets: ["内容を入力してください"] });
      loadSlide(extractedData.slides.length - 1);
    }

    // スライドの削除
    function deleteCurrentSlide() {
      if (extractedData.slides.length <= 1) {
        alert("これ以上スライドを削除できません。最低1枚必要です。");
        return;
      }
      extractedData.slides.splice(currentSlideIndex, 1);
      const nextIndex = Math.max(0, currentSlideIndex - 1);
      loadSlide(nextIndex);
    }

    // 送信時のデータ回収処理
    function handleFormSubmit() {
      document.getElementById('payloadInput').value = JSON.stringify(extractedData);
    }

    // 初期化実行
    window.onload = function() {
      // 外部からデータが流し込まれる場合の待機
      if (typeof window.INITIAL_SLIDES !== 'undefined') {
        extractedData = window.INITIAL_SLIDES;
      }
      initUI();
    };
  </script>
</body>
</html>
