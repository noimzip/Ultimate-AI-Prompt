<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク管理ダッシュボード</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  
  :root {
    --bg-primary: #0b0f19;
    --bg-secondary: #111827;
    --accent: #10b981;
    --accent-hover: #059669;
    --accent-light: rgba(16, 185, 129, 0.15);
    --text-main: #f9fafb;
    --text-muted: #9ca3af;
    --border: #1f2937;
    --card-bg: rgba(17, 24, 39, 0.7);
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --warning: #f59e0b;
    --info: #6366f1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-main);
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 900px;
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }

  h2 {
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.5em;
    margin-bottom: 4px;
  }

  h2 .icon {
    color: var(--accent);
    font-size: 1.1em;
  }

  .subtitle {
    font-size: 0.88em;
    color: var(--text-muted);
    margin-bottom: 22px;
  }

  /* Filters */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 0.8em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
  }

  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .stats-bar {
    display: flex;
    gap: 20px;
    margin-bottom: 18px;
    padding: 12px 16px;
    background: var(--bg-secondary);
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .stat-item {
    font-size: 0.8em;
    color: var(--text-muted);
  }

  .stat-item strong {
    color: var(--text-main);
    font-size: 1.2em;
    margin-right: 4px;
  }

  /* Task List */
  .task-list {
    max-height: 340px;
    overflow-y: auto;
    margin-bottom: 22px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg-secondary);
  }

  .task-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s ease;
  }

  .task-item:last-child { border-bottom: none; }

  .task-item:hover {
    background: rgba(16, 185, 129, 0.04);
  }

  .task-item.completed {
    opacity: 0.5;
  }

  .task-item.completed .task-title {
    text-decoration: line-through;
  }

  .task-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    transition: all 0.2s ease;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: transparent;
    font-size: 0.7em;
  }

  .task-check:hover {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .task-check.checked {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  .task-content {
    flex: 1;
    min-width: 0;
  }

  .task-title {
    font-weight: 600;
    font-size: 0.92em;
    color: var(--text-main);
    margin-bottom: 3px;
  }

  .task-meta {
    display: flex;
    gap: 12px;
    font-size: 0.75em;
    color: var(--text-muted);
  }

  .task-notes {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 250px;
  }

  .task-due {
    white-space: nowrap;
  }

  .task-due.overdue {
    color: var(--danger);
    font-weight: 600;
  }

  .badge-overdue {
    font-size: 0.65em;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
    background: rgba(239, 68, 68, 0.2);
    color: #f87171;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 0.9em;
  }

  /* Add Task Form */
  .add-form {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .form-title {
    font-size: 0.85em;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .form-group.full-width {
    grid-column: 1 / -1;
  }

  .form-group label {
    font-size: 0.75em;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .form-group input,
  .form-group textarea {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 10px 12px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.88em;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-color: var(--accent);
  }

  .form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.85em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    color: var(--text-main);
    border-color: var(--text-muted);
  }

  .btn-complete {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.75em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .btn-complete:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }

  /* Submit form for GAS */
  .submit-section {
    margin-top: 18px;
    display: flex;
    justify-content: flex-end;
  }

  .btn-submit-gas {
    background: var(--info);
    color: #fff;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9em;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
  }

  .btn-submit-gas:hover {
    background: #4f46e5;
    transform: translateY(-1px);
  }

  .validation-error {
    color: var(--danger);
    font-size: 0.78em;
    margin-top: 4px;
    display: none;
  }
</style>
</head>
<body>

  <div class="container">
    <h2><span class="icon">☑</span> タスク管理ダッシュボード</h2>
    <div class="subtitle">Google Tasksのタスクを管理します。新しいタスクの追加、完了マーク、フィルターによる絞り込みが行えます。</div>

    <!-- Stats -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-item"><strong id="totalCount">0</strong>件</div>
      <div class="stat-item"><strong id="pendingCount">0</strong>未完了</div>
      <div class="stat-item"><strong id="overdueCount">0</strong>期限切れ</div>
      <div class="stat-item"><strong id="completedCount">0</strong>完了済み</div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('all')">すべて</button>
      <button class="filter-btn" onclick="setFilter('pending')">未完了</button>
      <button class="filter-btn" onclick="setFilter('overdue')">期限切れ</button>
      <button class="filter-btn" onclick="setFilter('completed')">完了済み</button>
    </div>

    <!-- Task List -->
    <div class="task-list" id="taskListContainer">
      <div class="empty-state">タスクを読み込み中...</div>
    </div>

    <!-- Add Task Form -->
    <div class="add-form">
      <div class="form-title">✦ 新しいタスクを追加</div>
      <div class="form-grid">
        <div class="form-group full-width">
          <label>タスクタイトル *</label>
          <input type="text" id="newTitle" placeholder="タスクのタイトルを入力">
          <div class="validation-error" id="titleError">タイトルを入力してください</div>
        </div>
        <div class="form-group full-width">
          <label>メモ</label>
          <textarea id="newNotes" rows="2" placeholder="詳細メモ（任意）"></textarea>
        </div>
        <div class="form-group">
          <label>期限日</label>
          <input type="date" id="newDueDate">
        </div>
        <div class="form-group" style="justify-content: flex-end;">
          <button class="btn btn-primary" onclick="addNewTask()">+ タスクを追加</button>
        </div>
      </div>
    </div>

    <!-- GAS Submit -->
    <div class="submit-section">
      <form action="https://script.google.com/macros/s/AKfycbz3vrvsQAFoIqHXN1W4D41WqqbXs3Z7-IVhGuMvoSEueWNfyEZsKbc8z8WaPRiRCfhuwg/exec" method="POST" target="_blank" onsubmit="handleFormSubmit()">
        <input type="hidden" name="payload" id="payloadInput">
        <button type="submit" class="btn-submit-gas">変更をGoogle Tasksに同期する</button>
      </form>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // Geminiが抽出・生成するタスクデータ
    // ----------------------------------------------------
    let extractedData = {
      taskListName: "マイタスク",
      tasks: [
        {
          id: "t1",
          title: "企画書の作成",
          notes: "第3四半期のマーケティング企画書を作成する",
          dueDate: "2026-05-28",
          status: "pending",
          overdue: false
        },
        {
          id: "t2",
          title: "クライアントへのメール返信",
          notes: "見積もり依頼への返答",
          dueDate: "2026-05-24",
          status: "pending",
          overdue: true
        },
        {
          id: "t3",
          title: "週次レポートの提出",
          notes: "",
          dueDate: "2026-05-30",
          status: "completed",
          overdue: false
        }
      ]
    };

    let currentFilter = 'all';
    let pendingActions = []; // GAS送信用のキュー

    // UI初期化
    function initUI() {
      updateStats();
      renderTaskList();
    }

    // 統計の更新
    function updateStats() {
      const tasks = extractedData.tasks;
      document.getElementById('totalCount').textContent = tasks.length;
      document.getElementById('pendingCount').textContent = tasks.filter(t => t.status === 'pending').length;
      document.getElementById('overdueCount').textContent = tasks.filter(t => t.overdue).length;
      document.getElementById('completedCount').textContent = tasks.filter(t => t.status === 'completed').length;
    }

    // フィルター設定
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderTaskList();
    }

    // フィルターされたタスクの取得
    function getFilteredTasks() {
      switch (currentFilter) {
        case 'pending':
          return extractedData.tasks.filter(t => t.status === 'pending');
        case 'overdue':
          return extractedData.tasks.filter(t => t.overdue && t.status === 'pending');
        case 'completed':
          return extractedData.tasks.filter(t => t.status === 'completed');
        default:
          return extractedData.tasks;
      }
    }

    // タスクリストの描画
    function renderTaskList() {
      const container = document.getElementById('taskListContainer');
      const filteredTasks = getFilteredTasks();

      if (filteredTasks.length === 0) {
        container.innerHTML = '<div class="empty-state">該当するタスクはありません。新しいタスクを追加してください。</div>';
        return;
      }

      container.innerHTML = '';
      filteredTasks.forEach(task => {
        const isCompleted = task.status === 'completed';
        const checkClass = isCompleted ? 'checked' : '';
        const itemClass = isCompleted ? 'completed' : '';

        let dueDateHtml = '';
        if (task.dueDate) {
          const overdueClass = task.overdue && !isCompleted ? 'overdue' : '';
          dueDateHtml = `<span class="task-due ${overdueClass}">📅 ${task.dueDate}</span>`;
        }

        let overdueBadge = '';
        if (task.overdue && !isCompleted) {
          overdueBadge = '<span class="badge-overdue">期限超過</span>';
        }

        let notesHtml = '';
        if (task.notes) {
          notesHtml = `<span class="task-notes">📝 ${task.notes}</span>`;
        }

        container.innerHTML += `
          <div class="task-item ${itemClass}">
            <button class="task-check ${checkClass}" onclick="toggleComplete('${task.id}')">${isCompleted ? '✓' : ''}</button>
            <div class="task-content">
              <div class="task-title">${task.title}</div>
              <div class="task-meta">
                ${dueDateHtml}
                ${notesHtml}
              </div>
            </div>
            ${overdueBadge}
            ${!isCompleted ? `<button class="btn-complete" onclick="completeTask('${task.id}')">完了にする</button>` : ''}
          </div>
        `;
      });
    }

    // タスクの完了/未完了の切り替え
    function toggleComplete(id) {
      const task = extractedData.tasks.find(t => t.id === id);
      if (task) {
        task.status = task.status === 'completed' ? 'pending' : 'completed';
        if (task.status === 'completed') {
          pendingActions.push({ action: 'complete_task', taskId: id });
        }
        updateStats();
        renderTaskList();
      }
    }

    // タスクの完了
    function completeTask(id) {
      const task = extractedData.tasks.find(t => t.id === id);
      if (task) {
        task.status = 'completed';
        pendingActions.push({ action: 'complete_task', taskId: id });
        updateStats();
        renderTaskList();
      }
    }

    // 新しいタスクの追加
    function addNewTask() {
      const titleInput = document.getElementById('newTitle');
      const notesInput = document.getElementById('newNotes');
      const dueDateInput = document.getElementById('newDueDate');
      const titleError = document.getElementById('titleError');

      // バリデーション
      if (!titleInput.value.trim()) {
        titleError.style.display = 'block';
        titleInput.style.borderColor = 'var(--danger)';
        return;
      }
      titleError.style.display = 'none';
      titleInput.style.borderColor = 'var(--border)';

      const today = new Date().toISOString().substring(0, 10);
      const newTask = {
        id: 'new_' + Date.now(),
        title: titleInput.value.trim(),
        notes: notesInput.value.trim(),
        dueDate: dueDateInput.value || '',
        status: 'pending',
        overdue: dueDateInput.value ? dueDateInput.value < today : false
      };

      extractedData.tasks.unshift(newTask);
      pendingActions.push({
        action: 'add_task',
        title: newTask.title,
        notes: newTask.notes,
        dueDate: newTask.dueDate
      });

      // フォームのリセット
      titleInput.value = '';
      notesInput.value = '';
      dueDateInput.value = '';

      updateStats();
      renderTaskList();
    }

    // GAS送信時のデータセット
    function handleFormSubmit() {
      document.getElementById('payloadInput').value = JSON.stringify({
        action: 'sync_tasks',
        taskListName: extractedData.taskListName,
        tasks: extractedData.tasks,
        pendingActions: pendingActions
      });
    }

    window.onload = function() {
      if (typeof window.INITIAL_TASKS !== 'undefined') {
        extractedData = window.INITIAL_TASKS;
      }
      initUI();
    };
  </script>
</body>
</html>
