<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ニュースダイジェスト・ダッシュボード</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
  
  :root {
    --bg-primary: #0a0b10;
    --bg-secondary: #12131a;
    --accent: #8b5cf6;
    --accent-hover: #7c3aed;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --border: rgba(139, 92, 246, 0.15);
    --card-bg: rgba(18, 19, 26, 0.7);
  }

  body {
    font-family: 'Outfit', sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-main);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 950px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.8);
  }

  h2 {
    color: var(--text-main);
    font-weight: 700;
    margin-top: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.6em;
  }

  h2 span {
    color: var(--accent);
    background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 0.9em;
    color: var(--text-muted);
    margin-bottom: 25px;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    height: 520px;
  }

  /* News List */
  .news-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
    overflow-y: auto;
    padding-right: 10px;
  }

  .news-card {
    background: var(--bg-secondary);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    text-align: left;
    position: relative;
    overflow: hidden;
  }

  .news-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(139, 92, 246, 0.15);
  }

  .news-card.active {
    border-color: var(--accent);
    background: rgba(139, 92, 246, 0.08);
  }

  .news-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .source-badge {
    background: rgba(139, 92, 246, 0.2);
    color: #c084fc;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
  }

  .news-title {
    font-size: 1.05em;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text-main);
  }

  /* News Detail & Insights */
  .detail-panel {
    background: var(--bg-secondary);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
  }

  .detail-header {
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 15px;
  }

  .detail-title {
    font-size: 1.3em;
    font-weight: 700;
    line-height: 1.4;
    color: var(--text-main);
    margin-bottom: 10px;
  }

  .detail-summary {
    font-size: 0.9em;
    line-height: 1.6;
    color: #d1d5db;
  }

  .insights-box {
    background: rgba(139, 92, 246, 0.04);
    border: 1px solid rgba(139, 92, 246, 0.2);
    border-radius: 12px;
    padding: 15px;
  }

  .insights-title {
    font-size: 0.85em;
    font-weight: 600;
    color: #a78bfa;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .key-points {
    margin: 0;
    padding-left: 20px;
    font-size: 0.85em;
    line-height: 1.6;
    color: #cbd5e1;
  }

  .key-points li {
    margin-bottom: 8px;
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    margin-top: auto;
  }

  .btn-export {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.85em;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-export:hover {
    background: var(--accent-hover);
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
  }
</style>
</head>
<body>

  <div class="container">
    <h2><span>✦</span> ニュースダイジェスト・ダッシュボード</h2>
    <div class="subtitle">AIが本日の重要トピックをまとめました。詳細と要点（キーインサイト）を確認し、レポートを出力できます。</div>

    <div class="layout">
      <!-- Left side: news cards list -->
      <div class="news-list" id="newsListContainer"></div>

      <!-- Right side: detailed panel -->
      <div class="detail-panel" id="detailPanel">
        <div style="margin: auto; text-align: center; color: var(--text-muted);">
          左のリストからニュースを選択してください。AIによる要約とインサイトが表示されます。
        </div>
      </div>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // Geminiが取得・整理するニュースデータ
    // ----------------------------------------------------
    let extractedData = {
      digestDate: "2026-05-23",
      articles: [
        {
          id: "n1",
          title: "次世代AIモデルの動向とオープンソースコミュニティの進化",
          source: "テックテクノロジー",
          time: "09:00",
          summary: "主要なAI開発企業から新たな推論型AIモデルが続々とリリースされており、業界の勢力図が変化しつつあります。特にオープンソースコミュニティにおけるモデル軽量化技術が進み、ローカル環境での高精度な推論が可能になっています。",
          keyPoints: [
            "主要企業による高度な推論特化型AIモデルの市場投入が活発化",
            "オープンソースによる軽量モデルがコンシューマー機でも動作可能に",
            "エッジAIの普及によるプライバシーと処理速度の向上が期待される"
          ]
        }
      ]
    };

    let selectedId = null;

    // UI初期化
    function initUI() {
      renderNewsList();
      if (extractedData.articles.length > 0) {
        selectNews(extractedData.articles[0].id);
      }
    }

    // ニュースリスト描画
    function renderNewsList() {
      const container = document.getElementById('newsListContainer');
      container.innerHTML = '';
      
      extractedData.articles.forEach(art => {
        const isActive = art.id === selectedId ? 'active' : '';
        container.innerHTML += `
          <div class="news-card ${isActive}" onclick="selectNews('${art.id}')">
            <div class="news-meta">
              <span class="source-badge">${art.source}</span>
              <span>${art.time}</span>
            </div>
            <div class="news-title">${art.title}</div>
          </div>
        `;
      });
    }

    // ニュース詳細選択
    function selectNews(id) {
      selectedId = id;
      renderNewsList();
      
      const art = extractedData.articles.find(a => a.id === id);
      const panel = document.getElementById('detailPanel');
      
      if (!art) {
        panel.innerHTML = '<div style="margin: auto; text-align: center; color: var(--text-muted);">記事が見つかりません</div>';
        return;
      }

      panel.innerHTML = `
        <div class="detail-header">
          <div class="detail-title">${art.title}</div>
          <div class="news-meta" style="margin-bottom: 0;">
            <span>情報元: <strong>${art.source}</strong></span>
            <span>配信時間: ${art.time}</span>
          </div>
        </div>
        
        <div class="detail-summary">${art.summary}</div>
        
        <div class="insights-box">
          <div class="insights-title">✧ 主要ポイントとインサイト</div>
          <ul class="key-points">
            ${art.keyPoints.map(kp => `<li>${kp}</li>`).join('')}
          </ul>
        </div>
        
        <div class="actions">
          <form action="https://script.google.com/macros/s/AKfycbz3vrvsQAFoIqHXN1W4D41WqqbXs3Z7-IVhGuMvoSEueWNfyEZsKbc8z8WaPRiRCfhuwg/exec" method="POST" target="_blank" onsubmit="handleExportSubmit('${art.id}')">
            <input type="hidden" name="payload" id="payloadInput-${art.id}">
            <button type="submit" class="btn-export">このダイジェストを保存する</button>
          </form>
        </div>
      `;
    }

    // エクスポート用データセット
    function handleExportSubmit(id) {
      const art = extractedData.articles.find(a => a.id === id);
      document.getElementById(`payloadInput-${id}`).value = JSON.stringify({
        action: "save_digest",
        date: extractedData.digestDate,
        article: art
      });
    }

    window.onload = function() {
      if (typeof window.INITIAL_NEWS !== 'undefined') {
        extractedData = window.INITIAL_NEWS;
      }
      initUI();
    };
  </script>
</body>
</html>
